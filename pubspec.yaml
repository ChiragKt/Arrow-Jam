name: arrow_jam
description: Arrow Jam — Arrow Grid Puzzle Game
publish_to: 'none'
version: 3.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  audioplayers: ^6.0.0
  google_mobile_ads: ^5.1.0  # FIX #3: ^8.0.0 does not exist on pub.dev

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/tap_clear.mp3
    - assets/sounds/collision.mp3
    - assets/sounds/level_win.mp3
